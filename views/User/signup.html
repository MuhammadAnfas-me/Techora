<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techora Registration</title>
    <link rel="stylesheet" href="/public/styles/user/signup.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="registration-container">
      <div class="card">
        <h2>Create Account</h2>

        <form>
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" placeholder="Full name" />
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" placeholder="you@example.com" />
          </div>

          <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                class="password-input"
                placeholder="Password"
              />
              <i class="far fa-eye toggle-password"></i>
            </div>
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                class="password-input"
                placeholder="Confirm"
              />
              <i class="far fa-eye toggle-password"></i>
            </div>
          </div>

          <div class="referral-group">
            <input type="text" placeholder="Referral code" />
            <button type="button" class="apply-btn">Apply</button>
          </div>

          <button type="submit" class="submit-btn">Create Account</button>

          <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <span
              >You will receive an OTP on your email id to verify your
              account.</span
            >
          </div>

          <div class="login-link">
            Already have an account? <a href="#"><strong>Login</strong></a>
          </div>

          <div class="divider">
            <span>OR</span>
          </div>

          <button type="button" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Sign in with Google
          </button>
        </form>
      </div>
    </div>

    <button class="dark-mode-toggle" id="modeBtn">
      <i class="fas fa-moon"></i>
    </button>

    <script>
      // Toggle Password Visibility
      const toggleIcons = document.querySelectorAll('.toggle-password')

      toggleIcons.forEach(icon => {
        icon.addEventListener('click', function () {
          const input = this.previousElementSibling
          const type =
          +input.getAttribute('type') === 'password' ? 'text' : 'password'
          input.setAttribute('type', type)
          this.classList.toggle('fa-eye')
          this.classList.toggle('fa-eye-slash')
        })
      })

      // Dark Mode Toggle
      const modeBtn = document.getElementById('modeBtn')
      modeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-theme')
        const icon = modeBtn.querySelector('i')
        if (document.body.classList.contains('dark-theme')) {
          icon.classList.replace('fa-moon', 'fa-sun')
        } else {
          icon.classList.replace('fa-sun', 'fa-moon')
        }
      })
    </script>
  </body>
</html>
