<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Techora Admin Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1B3C53",
              "background-light": "#E9F0F5",
              "background-dark": "#0F172A",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
              sans: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
            },
          },
        },
      };
    </script>
<style>
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-sans min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">
<button class="fixed top-6 right-6 p-2 rounded-full bg-white dark:bg-slate-800 shadow-sm border border-gray-200 dark:border-slate-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700 transition-all" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-rounded block dark:hidden">dark_mode</span>
<span class="material-symbols-rounded hidden dark:block">light_mode</span>
</button>
<div class="w-full max-w-md">
<main class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl shadow-blue-900/5 dark:shadow-none border border-white dark:border-slate-800 p-8 md:p-10 transition-colors duration-300">
<div class="flex flex-col items-center mb-8">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-rounded text-primary text-3xl">smartphone</span>
<span class="text-2xl font-bold text-primary dark:text-blue-400 tracking-tight">TECHORA</span>
</div>
<h1 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">Admin Login</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm">Sign in to access the admin dashboard</p>
</div>
<form action="#" class="space-y-5" method="POST">
<div>
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="email" name="email" placeholder="admin@mobilemart.com" required="" type="email"/>
</div>
<div>
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" for="password">Password</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none pr-12" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" type="button">
<span class="material-symbols-rounded text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-primary hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-lg shadow-primary/10" type="submit">
<span class="material-symbols-rounded text-[18px]">key</span>
                        Sign In
                    </button>
</div>
</form>
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800">
<div class="flex items-center justify-center gap-2 text-slate-500 dark:text-slate-400 text-xs font-medium">
<span class="material-symbols-rounded text-emerald-500 text-[18px]">check_circle</span>
                    Secure admin access with role-based protection
                </div>
</div>
</main>
<footer class="mt-8 text-center text-slate-400 dark:text-slate-500 text-xs">
            © 2024 MobileMart Admin. All rights reserved.
        </footer>
</div>
<div class="fixed -z-10 top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-40 dark:opacity-10">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-200 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-indigo-200 blur-[120px] rounded-full"></div>
</div>
<script>
        // Simple script to toggle password visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passwordInput = document.querySelector('#password');
        const icon = toggleBtn.querySelector('.material-symbols-rounded');
        toggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>

</body></html>
