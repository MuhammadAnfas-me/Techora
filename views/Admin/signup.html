<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MobileMart Admin Login</title>
    <link rel="stylesheet" href="/public/styles/signup.css">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="logo">
                <div class="logo-icon"></div>
                <span>MobileMart</span>
            </div>

            <h2>Admin Login</h2>
            <p class="subtitle">Sign in to access the admin dashboard</p>

            <form>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" value="admin@mobilemart.com" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-field">
                        <input type="password" placeholder="Enter your password" />
                        <span class="eye">👁</span>
                    </div>
                </div>

                <button type="submit" class="btn">
                    🔒 Sign In
                </button>
            </form>

            <div class="secure-text">
                ✔ Secure admin access with role-based protection
            </div>
        </div>

        <footer>
            © 2024 MobileMart Admin. All rights reserved.
        </footer>
    </div>

</body>

</html>
